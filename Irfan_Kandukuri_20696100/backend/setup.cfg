[tool:pytest]
testpaths = tests rag/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing --cov-branch -q

[coverage:run]
relative_files = True
omit =
    app/telemetry.py
    .venv/*
    tests/*
    rag/tests/*
    conftest.py
    fix_coverage_paths.py
    chroma_db/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.:
